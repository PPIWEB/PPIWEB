<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mapa de Lotes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.1.0/ol.css">
    
    <style>
        /* Esto hace que el mapa sea visible */
        #map {
            width: 100%;
            height: 700px; /* Puedes cambiar la altura */
            border: 1px solid black;
        }
    </style>

</head>
<body>

    <h1>Mapa de Lotes (Actualizado desde CSV)</h1>
    <p>Los datos de "Estado" y "Cuota" vienen del archivo CSV.</p>

    <div id="map"></div>


    <script src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.4.1/papaparse.min.js"></script>

    <script src="COMBINADO_2.js"></script>


    <script>
        
        // --- PASO 2: CREAR EL MAPA Y LA CAPA VACÍA ---

        // 1. Define tu función de estilo (TU CÓDIGO)
        // ¡¡AQUÍ DEBES PEGAR TU PROPIA FUNCIÓN DE ESTILOS!!
        // Esta es solo un EJEMPLO.
        const miEstilo = function(feature) {
            const estado = feature.get('Estado') || 'Sin Datos';
            
            let colorDeRelleno = 'rgba(128, 128, 128, 0.5)'; // Gris (default)

            if (estado === 'Vendido') {
                colorDeRelleno = 'rgba(230, 25, 75, 0.7)'; // Rojo
            } else if (estado === 'Libre') {
                colorDeRelleno = 'rgba(60, 180, 75, 0.7)'; // Verde
            } else if (estado === 'Cancelado') {
                colorDeRelleno = 'rgba(255, 225, 25, 0.7)'; // Amarillo
            }

            return new ol.style.Style({
                fill: new ol.style.Fill({
                    color: colorDeRelleno
                }),
                stroke: new ol.style.Stroke({
                    color: '#333333', // Borde negro
                    width: 1
                })
            });
        };

        // 2. Define la fuente (source) VACÍA.
        const miFuenteVectorial = new ol.source.Vector();

        // 3. Crea tu capa (layer), pasándole esa fuente vacía
        const miCapaDeLotes = new ol.layer.Vector({
            source: miFuenteVectorial,
            style: miEstilo // ¡Usa tu función de estilo!
        });

        // 4. Crea tu mapa y añade la capa (aún vacía)
        const map = new ol.Map({
            target: 'map', // El 'id' del <div> de arriba
            layers: [
                new ol.layer.Tile({ source: new ol.source.OSM() }),
                miCapaDeLotes // Tu capa
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([-57.425, -25.394]), // Centro (Lon, Lat)
                zoom: 15
            })
        });

        // Opcional: Añadir popup al hacer clic (¡Aquí pegas tu código de popup!)
        map.on('click', function(evt) {
            const feature = map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                return feature;
            });
            if (feature) {
                const props = feature.getProperties();
                alert(
                    `ID: ${props.ID}\n` +
                    `Estado: ${props.Estado}\n` + // Vendrá del CSV
                    `Cuota: ${props.Cuota}`   // Vendrá del CSV
                );
            }
        });


        // --- PASO 3: FUNCIÓN PARA CARGAR Y COMBINAR DATOS ---

        function cargarYCombinarDatos() {
            
            console.log("Iniciando carga de datos...");

            // 1. Usar Papa Parse para leer tu CSV
            // ¡¡RECUERDA LIMPIAR TU CSV PRIMERO!!
            Papa.parse("PPI TABLA - PPI TABLA.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                
                // 2. 'complete' se ejecuta cuando el CSV se cargó
                complete: function(results) {
                    console.log("CSV cargado. Procesando...");
                    
                    // 3. Crear un "índice" (Map) para buscar datos por ID
                    const dataMap = new Map();
                    results.data.forEach(row => {
                        if (row.ID) {
                            dataMap.set(row.ID.trim(), row);
                        }
                    });

                    // 4. Preparar el formateador de GeoJSON
                    const geoJSONFormat = new ol.format.GeoJSON({
                        dataProjection: 'EPSG:4326', // Tus datos están en Lon/Lat
                        featureProjection: 'EPSG:3857' // Tu mapa usa Mercator
                    });

                    // 5. Leer los polígonos desde la variable 'json_COMBINADO_2'
                    const features = geoJSONFormat.readFeatures(json_COMBINADO_2);

                    // 6. ¡LA UNIÓN!
                    features.forEach(feature => {
                        const id = feature.get('ID');
                        const csvData = dataMap.get(id);

                        if (csvData) {
                            // Copia TODAS las propiedades del CSV al polígono
                            feature.setProperties(csvData);
                        } else {
                            feature.set('Estado', 'Sin Datos');
                        }
                    });

                    // 7. AÑADIR LOS DATOS AL MAPA
                    miFuenteVectorial.clear();
                    miFuenteVectorial.addFeatures(features); // ¡Añadimos features actualizados!

                    // 8. Opcional: Centrar el mapa en los datos
                    map.getView().fit(miFuenteVectorial.getExtent(), {
                        padding: [50, 50, 50, 50],
                        duration: 1000
                    });
                    
                    console.log("¡MAPA ACTUALIZADO con datos del CSV!");
                },
                error: function(err) {
                    console.error("¡Error grave al cargar el CSV!", err);
                }
            });
        }

        // --- PASO 4: LLAMAR A LA FUNCIÓN PARA EMPEZAR TODO ---
        cargarYCombinarDatos();

    </script>

</body>
</html>
