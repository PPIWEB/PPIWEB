name: Update Map Data
on:
  push:
    branches:
      - PPIWEBAPP  # Listens for changes on your active branch
    paths:
      - 'layers/PPI_TABLA.csv'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: PPIWEBAPP # Ensures the action pulls from the correct branch

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install pandas

      - name: Run update script
        run: python update_map.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add layers/COMBINADO_3.js
          git commit -m "Auto-update layers/COMBINADO_3.js from PPI_TABLA.csv" || echo "No changes"
          git push origin PPIWEBAPP # Explicitly pushes to the PPIWEBAPP branch
