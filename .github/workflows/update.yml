- name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the specific file updated by your python script
          git add layers/COMBINADO_3.js
          
          # Check if there are changes before committing to avoid empty commit errors
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update map layer from CSV"
            
            # THE FIX: Pull remote changes and rebase your new commit on top of them
            # This prevents the [rejected] error by syncing with the remote first
            git pull --rebase origin PPIWEBAPP
            
            git push origin PPIWEBAPP
          fi
