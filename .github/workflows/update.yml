name: Update Map Data

on:
  push:
    branches:
      - PPIWEBAPP   # Runs only on this branch
    paths:
      - 'layers/PPI_TABLA.csv'  # Runs only when the CSV is updated

jobs:
  update-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push the updated JS file back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: PPIWEBAPP
          fetch-depth: 0 # Fetches all history so rebase/push works correctly

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Removed 'Install Dependencies' because the script uses standard Python libraries

      - name: Run Update Script
        run: python update_map.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the specific file
          git add layers/COMBINADO_3.js
          
          # Check for changes
          if git diff --staged --quiet; then
            echo "No changes detected in the JS file. Skipping commit."
          else
            git commit -m "Auto-update map layer from CSV"
            
            # Rebase ensures your push doesn't fail if the remote changed during the run
            git pull --rebase origin PPIWEBAPP
            git push origin PPIWEBAPP
          fi
